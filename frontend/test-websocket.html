<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Manager Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        .container {
            background: #252526;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #3e3e42;
        }
        h1 {
            color: #4ec9b0;
            margin-top: 0;
        }
        h2 {
            color: #569cd6;
            border-bottom: 2px solid #3e3e42;
            padding-bottom: 10px;
        }
        .status {
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
            font-weight: bold;
        }
        .status.disconnected { background: #5a1e1e; color: #f48771; }
        .status.connecting { background: #5a4e1e; color: #dcdcaa; }
        .status.connected { background: #1e5a1e; color: #4ec9b0; }
        .status.authenticated { background: #1e3a5a; color: #9cdcfe; }
        .status.error { background: #5a1e1e; color: #f48771; }
        
        button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
            font-size: 14px;
        }
        button:hover {
            background: #1177bb;
        }
        button:disabled {
            background: #3e3e42;
            cursor: not-allowed;
        }
        
        input, select {
            background: #3c3c3c;
            border: 1px solid #3e3e42;
            color: #d4d4d4;
            padding: 8px;
            border-radius: 4px;
            margin: 5px;
        }
        
        .log {
            background: #1e1e1e;
            border: 1px solid #3e3e42;
            border-radius: 4px;
            padding: 10px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 12px;
        }
        .log-entry {
            padding: 4px;
            border-bottom: 1px solid #2d2d30;
        }
        .log-entry.info { color: #9cdcfe; }
        .log-entry.success { color: #4ec9b0; }
        .log-entry.error { color: #f48771; }
        .log-entry.warning { color: #dcdcaa; }
        
        .subscription-list {
            background: #1e1e1e;
            border: 1px solid #3e3e42;
            border-radius: 4px;
            padding: 10px;
            min-height: 100px;
        }
        .subscription-item {
            background: #2d2d30;
            padding: 8px;
            margin: 5px 0;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .tick-data {
            background: #1e1e1e;
            border: 1px solid #3e3e42;
            border-radius: 4px;
            padding: 10px;
            margin: 5px 0;
        }
        .tick-data .symbol {
            color: #4ec9b0;
            font-weight: bold;
            font-size: 16px;
        }
        .tick-data .price {
            color: #9cdcfe;
            font-size: 24px;
            font-weight: bold;
        }
        .tick-data .change {
            font-size: 14px;
        }
        .tick-data .change.positive { color: #4ec9b0; }
        .tick-data .change.negative { color: #f48771; }
    </style>
</head>
<body>
    <h1>🔌 WebSocket Manager Test Interface</h1>
    
    <div class="container">
        <h2>Connection Status</h2>
        <div id="status" class="status disconnected">DISCONNECTED</div>
        <div>
            <button id="connectBtn" onclick="connect()">Connect</button>
            <button id="disconnectBtn" onclick="disconnect()" disabled>Disconnect</button>
        </div>
    </div>
    
    <div class="container">
        <h2>Subscription Management</h2>
        <div>
            <input type="text" id="symbol" placeholder="Symbol (e.g., NIFTY)" value="NIFTY">
            <select id="exchange">
                <option value="NSE">NSE</option>
                <option value="BSE">BSE</option>
                <option value="NFO">NFO</option>
                <option value="MCX">MCX</option>
            </select>
            <button onclick="subscribe()">Subscribe</button>
        </div>
        <h3>Active Subscriptions</h3>
        <div id="subscriptions" class="subscription-list">
            <em>No active subscriptions</em>
        </div>
    </div>
    
    <div class="container">
        <h2>Live Market Data</h2>
        <div id="tickData"></div>
    </div>
    
    <div class="container">
        <h2>Event Log</h2>
        <button onclick="clearLog()">Clear Log</button>
        <div id="log" class="log"></div>
    </div>
    
    <script type="module">
        import { wsManager, ConnectionState } from './src/services/websocketManager.js';
        import { setString, STORAGE_KEYS } from './src/services/storageService.js';
        
        // Make functions global for onclick handlers
        window.wsManager = wsManager;
        window.subscriptions = new Map();
        window.tickData = new Map();
        
        // Set test API key
        setString(STORAGE_KEYS.OA_API_KEY, 'test_api_key');
        
        // Log function
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            const timestamp = new Date().toLocaleTimeString();
            entry.textContent = `[${timestamp}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        window.log = log;
        
        // Update status display
        function updateStatus(state) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = state;
            statusDiv.className = `status ${state.toLowerCase()}`;
            
            const connectBtn = document.getElementById('connectBtn');
            const disconnectBtn = document.getElementById('disconnectBtn');
            
            if (state === 'DISCONNECTED') {
                connectBtn.disabled = false;
                disconnectBtn.disabled = true;
            } else {
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
            }
        }
        
        // Listen to state changes
        wsManager.onStateChange((newState, oldState) => {
            log(`State changed: ${oldState} → ${newState}`, 'info');
            updateStatus(newState);
        });
        
        // Connect function
        window.connect = function() {
            log('Connecting to WebSocket...', 'info');
            wsManager.connect();
        };
        
        // Disconnect function
        window.disconnect = function() {
            log('Disconnecting from WebSocket...', 'info');
            wsManager.disconnect();
            window.subscriptions.clear();
            updateSubscriptionList();
            updateTickData();
        };
        
        // Subscribe function
        window.subscribe = function() {
            const symbol = document.getElementById('symbol').value.trim().toUpperCase();
            const exchange = document.getElementById('exchange').value;
            
            if (!symbol) {
                log('Please enter a symbol', 'error');
                return;
            }
            
            const key = `${symbol}:${exchange}`;
            
            if (window.subscriptions.has(key)) {
                log(`Already subscribed to ${key}`, 'warning');
                return;
            }
            
            const callback = (tick) => {
                log(`Received tick for ${key}: LTP=${tick.ltp}`, 'success');
                window.tickData.set(key, tick);
                updateTickData();
            };
            
            wsManager.subscribe(symbol, exchange, callback);
            window.subscriptions.set(key, { symbol, exchange, callback });
            
            log(`Subscribed to ${key}`, 'success');
            updateSubscriptionList();
        };
        
        // Unsubscribe function
        window.unsubscribe = function(key) {
            const sub = window.subscriptions.get(key);
            if (sub) {
                wsManager.unsubscribe(sub.symbol, sub.exchange, sub.callback);
                window.subscriptions.delete(key);
                window.tickData.delete(key);
                log(`Unsubscribed from ${key}`, 'info');
                updateSubscriptionList();
                updateTickData();
            }
        };
        
        // Update subscription list
        function updateSubscriptionList() {
            const subsDiv = document.getElementById('subscriptions');
            
            if (window.subscriptions.size === 0) {
                subsDiv.innerHTML = '<em>No active subscriptions</em>';
                return;
            }
            
            subsDiv.innerHTML = '';
            window.subscriptions.forEach((sub, key) => {
                const item = document.createElement('div');
                item.className = 'subscription-item';
                item.innerHTML = `
                    <span>${key}</span>
                    <button onclick="unsubscribe('${key}')">Unsubscribe</button>
                `;
                subsDiv.appendChild(item);
            });
        }
        
        // Update tick data display
        function updateTickData() {
            const tickDiv = document.getElementById('tickData');
            
            if (window.tickData.size === 0) {
                tickDiv.innerHTML = '<em>No market data received yet</em>';
                return;
            }
            
            tickDiv.innerHTML = '';
            window.tickData.forEach((tick, key) => {
                const item = document.createElement('div');
                item.className = 'tick-data';
                
                const change = tick.change || 0;
                const changeClass = change >= 0 ? 'positive' : 'negative';
                const changeSymbol = change >= 0 ? '+' : '';
                
                item.innerHTML = `
                    <div class="symbol">${key}</div>
                    <div class="price">₹${tick.ltp || tick.close || 0}</div>
                    <div class="change ${changeClass}">${changeSymbol}${change} (${tick.change_percent || 0}%)</div>
                    <div style="font-size: 12px; color: #858585; margin-top: 5px;">
                        Volume: ${tick.volume || 0} | Time: ${new Date(tick.timestamp || Date.now()).toLocaleTimeString()}
                    </div>
                `;
                tickDiv.appendChild(item);
            });
        }
        
        // Clear log
        window.clearLog = function() {
            document.getElementById('log').innerHTML = '';
        };
        
        // Initial log
        log('WebSocket Manager Test Interface loaded', 'success');
        log('Click "Connect" to establish WebSocket connection', 'info');
        log('Note: Backend must be running for connection to succeed', 'warning');
    </script>
</body>
</html>
