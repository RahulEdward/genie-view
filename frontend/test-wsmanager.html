<!DOCTYPE html>
<html>
<head>
    <title>Test wsManager Import</title>
</head>
<body>
    <h1>Testing wsManager Import</h1>
    <div id="result"></div>
    
    <script type="module">
        try {
            const module = await import('./src/services/websocketManager.js');
            console.log('Module loaded:', module);
            console.log('wsManager:', module.wsManager);
            console.log('WS_STATES:', module.WS_STATES);
            
            document.getElementById('result').innerHTML = `
                <p style="color: green;">✓ Module loaded successfully!</p>
                <p>wsManager: ${typeof module.wsManager}</p>
                <p>WS_STATES: ${typeof module.WS_STATES}</p>
                <pre>${JSON.stringify(Object.keys(module), null, 2)}</pre>
            `;
        } catch (error) {
            console.error('Import failed:', error);
            document.getElementById('result').innerHTML = `
                <p style="color: red;">✗ Import failed!</p>
                <pre>${error.message}\n${error.stack}</pre>
            `;
        }
    </script>
</body>
</html>
